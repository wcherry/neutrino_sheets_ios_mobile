name: NeutrinoSheets
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
  # The code shared with the other Neutrino iOS apps: account identity, the
  # OAuth/PKCE flow, the E2EE key lifecycle and the sign-in screens.
  #
  # A local path, so the two repositories have to sit side by side. Swap this for
  # `url:` + `from:` once neutrino_shared_ios is pushed and tagged.
  NeutrinoShared:
    path: ../neutrino_shared_ios
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoSheets:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoSheets
    dependencies:
      # No swift-markdown: unlike Neutrino Docs, nothing here parses Markdown. swift-sodium is the
      # only dependency, and it is the same one every Neutrino iOS app uses for the E2EE primitives.
      - package: swift-sodium
        product: Sodium
      - package: NeutrinoShared
        product: NeutrinoCore
      - package: NeutrinoShared
        product: NeutrinoAuth
      - package: NeutrinoShared
        product: NeutrinoCrypto
      - package: NeutrinoShared
        product: NeutrinoUI
      # Zip and XML plumbing only — `ZipArchive` and `XMLElement`, Foundation + Compression, no
      # dependency on anything else in the package. Reading and writing the `.xlsx` itself is
      # `Workbook/OOXML/` in this repo: the mapping is Sheets-shaped, so it does not belong in a
      # package the other five apps rebuild against.
      - package: NeutrinoShared
        product: NeutrinoOOXML
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.sheets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoSheets/NeutrinoSheets.entitlements
      properties:
        # Universal Links: `https://www.getneutrino.app/open/sheet/<file id>` opens a spreadsheet
        # here instead of in Safari. Both host spellings are claimed so a link pasted without the
        # "www." still resolves.
        #
        # The entitlement is claimed now, but which *paths* reach this app is decided by the
        # apple-app-site-association document served from the domain — and today that file routes
        # `/open/sheet/*` to `com.neutrino.drive` with the comment "No Sheets iOS app yet". Moving
        # it is Epic 25, sequenced with the App Store release. Until then `FeatureFlags.appLinks`
        # is off and iOS never delivers those links here anyway.
        com.apple.developer.associated-domains:
          - applinks:www.getneutrino.app
          - applinks:getneutrino.app
    info:
      path: NeutrinoSheets/Info.plist
      properties:
        CFBundleName: Neutrino Sheets
        CFBundleDisplayName: Neutrino Sheets
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # actool writes only the *nested* CFBundleIcons > CFBundlePrimaryIcon >
        # CFBundleIconName. The top-level key is normally added by Xcode's Info.plist generation,
        # which this target doesn't use (it has an explicit Info.plist), so declare it here — App
        # Store Connect rejects the upload with error 90713 without it.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # Landscape matters more here than it does for a document editor: a spreadsheet is wide.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Neutrino Sheets uses Face ID to unlock your end-to-end encrypted spreadsheets."
        NSCameraUsageDescription: "Neutrino Sheets needs camera access to scan the QR code that carries your encryption key."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Neutrino Sheets Key File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neutrino.sheets.keyfile
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: Neutrino Sheets Key File
            UTTypeTagSpecification:
              public.filename-extension:
                - json

  NeutrinoSheetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoSheetsTests
    dependencies:
      - target: NeutrinoSheets
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
